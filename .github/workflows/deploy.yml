name: Deploy

# Quy trình: nhánh tính năng → `dev` → test UI trên staging → `dev` vào `main` → production.
#   push `dev`  → deploy STAGING    (thư mục vars.APP_DIR_STG, .env lấy từ .env.stg)
#   push `main` → deploy PRODUCTION (thư mục vars.APP_DIR)
# Hai thư mục riêng vì bước deploy chạy `git reset --hard origin/<nhánh>` — hai nhánh khác nhau
# không dùng chung một cây làm việc được.
# Có thể chạy tay ở tab Actions (workflow_dispatch).
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      bo_qua_test:
        description: "Bỏ cổng build-test, deploy thẳng (chỉ khi đã tự chạy test)"
        type: boolean
        default: false

# Không cho 2 lần deploy chồng nhau TRÊN CÙNG môi trường; không hủy lần đang chạy (deploy dở
# nguy hiểm).
#
# Staging + production chạy CHUNG một VPS nên cũng không được build/migrate cùng lúc — nhưng việc đó
# khoá bằng `flock` TRÊN VPS (đầu script dưới), KHÔNG gộp chung một concurrency group: GitHub chỉ giữ
# MỘT lượt chờ mỗi group, lượt mới vào sẽ HUỶ lượt đang chờ. Gộp chung thì một lần push `dev` có thể
# lặng lẽ huỷ lần deploy production đang xếp hàng. Tách theo nhánh thì lượt bị thay luôn là bản cũ
# hơn của CÙNG nhánh — đúng ý.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # 1) CI gate — không deploy nếu build/test gãy.
  #    Định nghĩa nằm ở `build-test.yml` (dùng chung với CI của pull request), KHÔNG chép lại ở
  #    đây: hai bản rời nhau thì PR và deploy sẽ kiểm hai thứ khác nhau mà không ai biết.
  # ---------------------------------------------------------------
  build-test:
    # Chạy TAY có thể tắt cổng này khi đã tự chạy test ở máy. Kích bằng `push` thì `inputs` rỗng
    # ⇒ điều kiện luôn đúng ⇒ push vẫn phải qua cổng như cũ.
    if: inputs.bo_qua_test != true
    uses: ./.github/workflows/build-test.yml

  # ---------------------------------------------------------------
  # 2) Deploy — SSH vào VPS, kéo code, dựng lại containers.
  #    Dùng vars/secrets đã cấu hình trong repo Settings.
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: build-test
    # `always()` để job vẫn được xét khi cổng bị bỏ (kết quả `skipped`); vế sau mới là chỗ quyết:
    # cổng xanh, HOẶC người chạy tay chủ động bỏ cổng.
    if: always() && (needs.build-test.result == 'success' || inputs.bo_qua_test == true)
    runs-on: ubuntu-latest
    steps:
      - name: SSH → git pull + docker compose up
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          port: ${{ vars.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Mặc định của action là 10 phút. Lượt này có thể phải chờ khoá (deploy môi trường kia đang
          # chạy, tối đa 20 phút) rồi mới tới phần build của chính nó.
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd "${{ github.ref_name == 'main' && vars.APP_DIR || vars.APP_DIR_STG }}"

            # Staging + production chung VPS: build (npm ci, vite), migrate, dựng container của hai
            # môi trường KHÔNG được chạy chồng nhau — tranh CPU/RAM làm prod chậm, cả hai cùng migrate
            # cùng lúc thì khó đoán. Khoá giữ tới khi shell này thoát.
            echo "→ Chờ khoá deploy của VPS (môi trường kia có thể đang deploy)"
            exec 9>/tmp/erp-svn-deploy.lock
            if ! flock -w 1200 9; then
              echo "DỪNG: chờ khoá deploy quá 20 phút — lần deploy khác đang kẹt? Kiểm: ps aux | grep 'docker compose'"
              exit 1
            fi

            echo "→ Kéo code mới nhất (origin/${{ github.ref_name }})"
            git fetch --all --prune
            git reset --hard "origin/${{ github.ref_name }}"

            # .env nằm ngoài git nên `git reset` không đụng tới — thêm khoá mới (Redis/MinIO)
            # mà quên cập nhật .env thì backend crash-loop. Chặn ngay ở đây cho dễ hiểu.
            echo "→ Kiểm .env có đủ khoá"
            REQUIRED="COMPOSE_PROFILES POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB JWT_SECRET SEED_ADMIN_PASSWORD CORS_ORIGINS SITE_DOMAIN MINIO_ROOT_USER MINIO_ROOT_PASSWORD"
            MISSING=""
            for KEY in $REQUIRED; do
              VALUE=$(grep -E "^${KEY}=" .env | head -n1 | cut -d= -f2- || true)
              if [ -z "$VALUE" ] || [ "$VALUE" = "__DIEN_VAO__" ]; then
                MISSING="$MISSING $KEY"
              fi
            done
            if [ -n "$MISSING" ]; then
              echo "DỪNG deploy — .env trên VPS thiếu hoặc chưa điền:$MISSING"
              echo "Cách sửa: chép nội dung .env.prod (hoặc .env.stg) sang .env rồi điền các chỗ __DIEN_VAO__."
              exit 1
            fi

            # Build image MỚI nhưng CHƯA thay container đang phục vụ. Phải build trước bước migrate
            # ở dưới, nếu không container tạm sẽ chạy migration bằng image CŨ.
            echo "→ Build image mới (chưa thay container)"
            docker compose build

            # MIGRATION CHẠY TRƯỚC KHI THAY CONTAINER (chốt 2026-08-09) — áp cho cả staging và prod.
            # Container tạm `run --rm` không đụng container đang phục vụ; migration lỗi thì
            # `set -e` dừng script ngay tại đây và **app cũ vẫn sống**. Trước đây migration chỉ chạy
            # trong lifespan của app mới, nên migration lỗi = app mới chết = mất dịch vụ (staging
            # chết 21 giờ vì guard 0171 raise).
            # Không cần `--no-deps`: compose tự chờ db/redis/minio healthy theo `depends_on`.
            echo "→ Chạy migration bằng container tạm (app cũ vẫn đang phục vụ)"
            docker compose run --rm -T backend python -m app.migrate

            # Dựng service nào là do COMPOSE_PROFILES trong .env quyết (bản triển khai khai đủ
            # 6, thêm `backup` là 7). KHÔNG dùng --remove-orphans: chạy kèm profiles rất dễ xoá nhầm
            # container của profile đang tắt.
            # `web` chờ backend HEALTHY (depends_on) nên lệnh này tự đợi backend lên; backend hỏng
            # thì nó trả lỗi. Không để `set -e` thoát ngay ở đây — bước kiểm dưới còn phải in log.
            echo "→ Dựng lại & khởi động containers"
            UP_OK=1
            docker compose up -d --build || UP_OK=0

            echo "→ Trạng thái"
            docker compose ps

            # `docker compose ps` gần như luôn đẹp kể cả khi backend crash-loop. 2026-08-09 staging
            # chết 21 giờ vì migration 0171 raise mà Actions vẫn xanh; cổng này chặn ca đó.
            # Chờ healthcheck của compose (backend tự gọi /api/health, kiểm cả DB) báo `healthy`.
            echo "→ Chờ backend healthy (tối đa 120s)"
            OK=0
            TT="?"
            for i in $(seq 1 40); do
              CID=$(docker compose ps -q backend 2>/dev/null || true)
              if [ -n "$CID" ]; then
                TT=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}khong-co-healthcheck{{end}}' "$CID" 2>/dev/null || echo "?")
              fi
              if [ "$TT" = "healthy" ]; then
                OK=1; echo "  backend healthy (lần thử $i)"; break
              fi
              sleep 3
            done
            if [ "$OK" != "1" ]; then
              echo "DỪNG: backend không healthy sau 120s (trạng thái cuối: $TT). Log 80 dòng cuối:"
              docker compose logs --tail 80 backend || true
              docker compose ps || true
              exit 1
            fi

            # DB TRẮNG (lần deploy đầu của môi trường mới) chưa có ai đăng nhập được: SEED_DEMO=false
            # ⇒ lúc khởi động seeder KHÔNG ghi gì. Chỉ khi bảng users RỖNG mới tạo admin tối thiểu
            # (SEED_ADMIN_USERNAME/PASSWORD trong .env). Có người dùng rồi thì bỏ qua hẳn, không đụng DB.
            # Lệnh idempotent; lỗi ở đây không chặn deploy — chạy tay lại được.
            echo "→ Kiểm DB có tài khoản chưa"
            SO_USER=$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM users"' 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$SO_USER" = "0" ]; then
              echo "  users rỗng → tạo admin (app.khoi_tao_admin)"
              docker compose exec -T backend python -m app.khoi_tao_admin || echo "  CẢNH BÁO: tạo admin lỗi — chạy tay: docker compose run --rm backend python -m app.khoi_tao_admin"
            else
              echo "  đã có tài khoản (users=${SO_USER:-?}) — bỏ qua"
            fi

            # Kiểm thêm ĐƯỜNG THẬT người dùng đi: nginx (web) → backend. Backend healthy mà nginx
            # không tới được (sai tên service, resolver, web chưa lên) thì người dùng vẫn chỉ thấy lỗi.
            # Gọi trong container `web` vì mỗi môi trường bind cổng khác nhau (stg 8181, prod 8180).
            echo "→ Kiểm /api/health qua nginx (web → backend)"
            OK=0
            for i in $(seq 1 10); do
              if KQ=$(docker compose exec -T web wget -qO- http://127.0.0.1/api/health 2>/dev/null); then
                OK=1; echo "  web → backend OK (lần thử $i): $KQ"; break
              fi
              sleep 3
            done
            if [ "$OK" != "1" ]; then
              echo "DỪNG: backend healthy nhưng gọi qua web không được sau 30s. Log web:"
              docker compose logs --tail 40 web || true
              exit 1
            fi
            if [ "$UP_OK" != "1" ]; then
              echo "DỪNG: \`docker compose up\` báo lỗi (xem ở trên) dù backend + web đã chạy — kiểm service khác (caddy, backup…)."
              docker compose ps || true
              exit 1
            fi

            # Dọn image cũ SAU CÙNG: chạy trước health check thì lỡ cần lùi về image trước cũng
            # không còn gì để lùi. CHỈ image của project này (nhãn compose tự gắn lúc build) — prod
            # và staging chung VPS, không dọn hộ project kia.
            echo "→ Dọn image cũ"
            PROJECT=$(grep -E '^COMPOSE_PROJECT_NAME=' .env | tail -n1 | cut -d= -f2- | tr -d "\"' " || true)
            PROJECT=${PROJECT:-erp-svn}
            docker image prune -f --filter "label=com.docker.compose.project=${PROJECT}"
